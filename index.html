<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>我的本地 AI</title>

  <meta name="description" content="运行在浏览器本地的 AI 助手">
  <meta name="theme-color" content="#111827">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    body {
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部 */
    .header {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 2px;
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
    }

    .status-dot.ready {
      background: #22c55e;
    }

    .status-dot.loading {
      background: #f59e0b;
    }

    .status-dot.error {
      background: #ef4444;
    }

    /* 欢迎页 */
    .welcome {
      flex: 1;
      overflow-y: auto;
      padding: 32px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-inner {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 22px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
    }

    .welcome h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
    }

    .welcome p {
      margin: 12px auto 0;
      max-width: 500px;
      color: #6b7280;
      line-height: 1.7;
      font-size: 14px;
    }

    .info-box {
      margin: 24px auto 0;
      padding: 16px;
      max-width: 500px;
      text-align: left;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      background: white;
    }

    .info-title {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .info-list {
      margin: 0;
      padding-left: 20px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.8;
    }

    .start-button {
      margin-top: 22px;
      width: 100%;
      max-width: 360px;
      height: 50px;
      border: 0;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .start-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* 加载 */
    .loading-panel {
      display: none;
      margin: 24px auto 0;
      width: 100%;
      max-width: 500px;
      padding: 18px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      text-align: left;
    }

    .loading-panel.show {
      display: block;
    }

    .loading-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .progress-background {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #111827;
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .progress-text {
      margin-top: 8px;
      font-size: 12px;
      color: #6b7280;
      word-break: break-word;
    }

    /* 聊天区域 */
    .chat {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .chat.show {
      display: flex;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 14px 20px;
      -webkit-overflow-scrolling: touch;
    }

    .message-row {
      display: flex;
      margin: 0 auto 14px;
      max-width: 800px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message {
      max-width: 88%;
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-row.assistant .message {
      background: white;
      border: 1px solid #e5e7eb;
      border-top-left-radius: 5px;
    }

    .message-row.user .message {
      background: #111827;
      color: white;
      border-top-right-radius: 5px;
    }

    .message.system {
      max-width: 100%;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
    }

    /* 输入区 */
    .input-area {
      flex-shrink: 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: white;
      border-top: 1px solid #e5e7eb;
    }

    .input-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #userInput {
      flex: 1;
      min-width: 0;
      max-height: 140px;
      min-height: 46px;
      resize: none;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      outline: none;
      background: #f9fafb;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
    }

    #userInput:focus {
      border-color: #9ca3af;
      background: white;
    }

    #sendButton {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border: 0;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .input-hint {
      max-width: 800px;
      margin: 7px auto 0;
      font-size: 10px;
      color: #9ca3af;
      text-align: center;
    }

    /* 错误提示 */
    .error-box {
      display: none;
      margin: 18px auto 0;
      width: 100%;
      max-width: 500px;
      padding: 14px;
      border-radius: 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      font-size: 13px;
      line-height: 1.6;
      text-align: left;
      word-break: break-word;
    }

    .error-box.show {
      display: block;
    }

    .retry-button {
      margin-top: 10px;
      border: 1px solid #fca5a5;
      background: white;
      color: #991b1b;
      padding: 8px 12px;
      border-radius: 9px;
      cursor: pointer;
    }

    /* 手机适配 */
    @media (max-width: 600px) {
      .header {
        height: 58px;
        padding: 0 12px;
      }

      .logo {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        font-size: 18px;
      }

      .brand-title {
        font-size: 15px;
      }

      .brand-subtitle {
        font-size: 10px;
      }

      .status {
        font-size: 10px;
      }

      .welcome {
        padding: 24px 16px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .welcome p {
        font-size: 13px;
      }

      .message {
        max-width: 91%;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- 顶部 -->
  <header class="header">
    <div class="brand">
      <div class="logo">AI</div>

      <div class="brand-text">
        <div class="brand-title">我的本地 AI</div>
        <div class="brand-subtitle">浏览器本地运行</div>
      </div>
    </div>

    <div class="status">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">未加载</span>
    </div>
  </header>


  <!-- 欢迎界面 -->
  <main id="welcome" class="welcome">

    <div class="welcome-inner">

      <div class="welcome-icon">AI</div>

      <h1>我的本地 AI</h1>

      <p>
        一个直接运行在浏览器中的 AI 助手。
        支持 WebGPU 的设备可以尝试在本地运行模型。
      </p>

      <div class="info-box">

        <div class="info-title">开始之前</div>

        <ul class="info-list">
          <li>第一次使用需要联网下载 AI 模型。</li>
          <li>模型下载后会尝试保存在浏览器缓存中。</li>
          <li>需要浏览器支持 WebGPU。</li>
          <li>首次加载可能需要等待一段时间。</li>
        </ul>

      </div>

      <button id="startButton" class="start-button">
        加载 AI
      </button>

      <div id="loadingPanel" class="loading-panel">

        <div class="loading-title">
          正在加载 AI 模型……
        </div>

        <div class="progress-background">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="progressText" class="progress-text">
          准备中……
        </div>

      </div>

      <div id="errorBox" class="error-box">

        <div id="errorText"></div>

        <button id="retryButton" class="retry-button">
          重新加载
        </button>

      </div>

    </div>

  </main>


  <!-- 聊天界面 -->
  <section id="chat" class="chat">

    <div id="messages" class="messages">

      <div class="message-row assistant">
        <div class="message">
          你好！我是你的本地 AI。请先加载模型，然后可以直接和我聊天。
        </div>
      </div>

    </div>

    <div class="input-area">

      <div class="input-container">

        <textarea
          id="userInput"
          placeholder="输入你的问题……"
          rows="1"
          disabled
        ></textarea>

        <button id="sendButton" disabled>
          ↑
        </button>

      </div>

      <div class="input-hint">
        AI 尽可能在你的设备浏览器中运行
      </div>

    </div>

  </section>

</div>


<script type="module">

  /*
   * ==========================================================
   * 我的本地 AI
   * WebLLM + LFM2.5 350M
   * ==========================================================
   *
   * 第一次打开网站：
   *
   * GitHub Pages
   *      ↓
   * index.html
   *      ↓
   * WebLLM
   *      ↓
   * 下载模型
   *      ↓
   * WebGPU
   *      ↓
   * 浏览器本地推理
   *
   */


  // ----------------------------------------------------------
  // 1. 加载 WebLLM
  // ----------------------------------------------------------

  let webllm = null;
  let engine = null;

  /*
   * 这个模型比较小，适合手机测试。
   *
   * 如果以后你想换更大的模型，
   * 可以修改这里的模型 ID。
   */

  const MODEL =
    "LFM2.5-350M-Instruct-q4f16_1-MLC";


  // ----------------------------------------------------------
  // 2. 获取页面元素
  // ----------------------------------------------------------

  const startButton =
    document.getElementById("startButton");

  const retryButton =
    document.getElementById("retryButton");

  const loadingPanel =
    document.getElementById("loadingPanel");

  const progressBar =
    document.getElementById("progressBar");

  const progressText =
    document.getElementById("progressText");

  const errorBox =
    document.getElementById("errorBox");

  const errorText =
    document.getElementById("errorText");

  const welcome =
    document.getElementById("welcome");

  const chat =
    document.getElementById("chat");

  const messages =
    document.getElementById("messages");

  const userInput =
    document.getElementById("userInput");

  const sendButton =
    document.getElementById("sendButton");

  const statusDot =
    document.getElementById("statusDot");

  const statusText =
    document.getElementById("statusText");


  // ----------------------------------------------------------
  // 3. 状态显示
  // ----------------------------------------------------------

  function setStatus(type, text) {

    statusDot.className =
      "status-dot " + type;

    statusText.textContent =
      text;
  }


  // ----------------------------------------------------------
  // 4. 显示错误
  // ----------------------------------------------------------

  function showError(message) {

    errorText.textContent =
      message;

    errorBox.classList.add("show");

    loadingPanel.classList.remove("show");

    startButton.disabled = false;

    startButton.textContent =
      "重新加载 AI";

    setStatus("error", "加载失败");
  }


  // ----------------------------------------------------------
  // 5. 检查 WebGPU
  // ----------------------------------------------------------

  async function checkWebGPU() {

    if (!("gpu" in navigator)) {

      throw new Error(
        "你的浏览器没有检测到 WebGPU。请尝试使用较新的 Chrome / Edge，并确认设备支持 WebGPU。"
      );
    }

    const adapter =
      await navigator.gpu.requestAdapter();

    if (!adapter) {

      throw new Error(
        "浏览器检测到了 WebGPU，但没有找到可用的 GPU 适配器。你的设备可能不支持当前 AI 模型。"
      );
    }

    return true;
  }


  // ----------------------------------------------------------
  // 6. 更新加载进度
  // ----------------------------------------------------------

  function updateProgress(progress) {

    /*
     * WebLLM 的进度通常是 0 ~ 1。
     */

    if (
      progress &&
      typeof progress.progress === "number"
    ) {

      let percent =
        Math.round(progress.progress * 100);

      percent =
        Math.max(0, Math.min(100, percent));

      progressBar.style.width =
        percent + "%";
    }

    if (progress && progress.text) {

      progressText.textContent =
        progress.text;
    }
  }


  // ----------------------------------------------------------
  // 7. 加载模型
  // ----------------------------------------------------------

  async function loadAI() {

    if (engine) {
      return;
    }

    startButton.disabled = true;

    errorBox.classList.remove("show");

    loadingPanel.classList.add("show");

    progressBar.style.width = "0%";

    progressText.textContent =
      "正在检查浏览器……";

    setStatus("loading", "准备中");


    try {

      // 检查 WebGPU

      await checkWebGPU();


      progressText.textContent =
        "正在加载 WebLLM……";


      /*
       * 动态加载 WebLLM。
       *
       * 使用 esm.run 是为了让这个 HTML
       * 不需要额外的 npm / Node.js 环境。
       */

      webllm =
        await import(
          "https://esm.run/@mlc-ai/web-llm"
        );


      progressText.textContent =
        "正在准备 AI 模型……";


      /*
       * 创建模型引擎。
       */

      engine =
        await webllm.CreateMLCEngine(
          MODEL,
          {
            initProgressCallback:
              updateProgress
          }
        );


      // 加载成功

      progressBar.style.width =
        "100%";

      progressText.textContent =
        "AI 加载完成！";


      setStatus("ready", "AI 已就绪");


      startButton.textContent =
        "AI 已加载";

      startButton.disabled =
        true;


      // 显示聊天区域

      setTimeout(() => {

        welcome.style.display =
          "none";

        chat.classList.add("show");

        userInput.disabled =
          false;

        sendButton.disabled =
          false;

        userInput.focus();

      }, 500);


    } catch (error) {

      console.error(
        "AI 加载失败:",
        error
      );

      engine =
        null;

      let message =
        error?.message ||
        String(error);

      showError(
        "AI 加载失败：\n" +
        message +
        "\n\n" +
        "如果这是第一次使用，请确认网络正常，并使用支持 WebGPU 的浏览器。"
      );

    }

  }


  // ----------------------------------------------------------
  // 8. 添加消息
  // ----------------------------------------------------------

  function addMessage(
    role,
    text
  ) {

    const row =
      document.createElement("div");

    row.className =
      "message-row " + role;


    const bubble =
      document.createElement("div");

    bubble.className =
      "message";


    /*
     * textContent 防止用户输入
     * 被当成 HTML 执行。
     */

    bubble.textContent =
      text;


    row.appendChild(bubble);

    messages.appendChild(row);


    // 自动滚动到底部

    messages.scrollTop =
      messages.scrollHeight;


    return bubble;
  }


  // ----------------------------------------------------------
  // 9. 聊天
  // ----------------------------------------------------------

  async function sendMessage() {

    if (!engine) {

      return;
    }


    const text =
      userInput.value.trim();


    if (!text) {

      return;
    }


    // 清空输入框

    userInput.value =
      "";

    userInput.style.height =
      "auto";


    // 显示用户消息

    addMessage(
      "user",
      text
    );


    // 创建 AI 消息气泡

    const assistantBubble =
      addMessage(
        "assistant",
        "思考中……"
      );


    sendButton.disabled =
      true;

    userInput.disabled =
      true;


    try {

      /*
       * 给模型的对话。
       */

      const messagesForAI = [

        {
          role: "system",

          content:
            "你是一个友好、准确、简洁的中文 AI 助手。请优先使用中文回答用户的问题。如果用户使用其他语言，可以使用对应语言回答。"
        },

        {
          role: "user",

          content: text
        }

      ];


      /*
       * 流式生成。
       */

      const chunks =
        await engine.chat.completions.create({

          messages:
            messagesForAI,

          temperature:
            0.7,

          max_tokens:
            512,

          stream:
            true

        });


      let answer =
        "";


      for await (
        const chunk of chunks
      ) {

        const delta =
          chunk?.choices?.[0]?.delta?.content;


        if (delta) {

          answer +=
            delta;

          assistantBubble.textContent =
            answer;

          messages.scrollTop =
            messages.scrollHeight;
        }

      }


      if (!answer) {

        assistantBubble.textContent =
          "AI 没有返回内容。请再试一次。";
      }


    } catch (error) {

      console.error(
        "聊天错误:",
        error
      );

      assistantBubble.textContent =
        "AI 运行时出现错误：\n" +
        (
          error?.message ||
          String(error)
        );

    }


    sendButton.disabled =
      false;

    userInput.disabled =
      false;

    userInput.focus();

  }


  // ----------------------------------------------------------
  // 10. 自动调整输入框高度
  // ----------------------------------------------------------

  userInput.addEventListener(
    "input",
    () => {

      userInput.style.height =
        "auto";

      userInput.style.height =
        Math.min(
          userInput.scrollHeight,
          140
        ) + "px";

    }
  );


  // ----------------------------------------------------------
  // 11. Enter 发送
  // ----------------------------------------------------------

  userInput.addEventListener(
    "keydown",
    (event) => {

      /*
       * 手机键盘 Enter 的行为
       * 由浏览器决定。
       *
       * 桌面端：
       * Enter = 发送
       * Shift + Enter = 换行
       */

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  // ----------------------------------------------------------
  // 12. 按钮事件
  // ----------------------------------------------------------

  startButton.addEventListener(
    "click",
    loadAI
  );


  retryButton.addEventListener(
    "click",
    loadAI
  );


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  // ----------------------------------------------------------
  // 13. 页面启动检查
  // ----------------------------------------------------------

  setStatus(
    "",
    "等待加载"
  );


  /*
   * 如果浏览器完全不支持 WebGPU，
   * 提前告诉用户。
   */

  if (!("gpu" in navigator)) {

    setStatus(
      "error",
      "不支持 WebGPU"
    );

  }

</script>

</body>
  </html>
