<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>我的本地 AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
      background: #f4f6fa;
      color: #111827;
    }

    .top {
      background: #111827;
      color: white;
      padding: 18px 18px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-small {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: white;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
    }

    .title-box h1 {
      margin: 0;
      font-size: 20px;
    }

    .title-box p {
      margin: 4px 0 0;
      opacity: .7;
      font-size: 13px;
    }

    .status {
      margin-left: auto;
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 5px;
    }

    .dot.ok {
      background: #22c55e;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 16px 50px;
    }

    .hero {
      text-align: center;
      padding: 10px 0 25px;
    }

    .logo-big {
      width: 140px;
      height: 140px;
      margin: auto;
      border-radius: 38px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      font-weight: 800;
    }

    .hero h2 {
      font-size: 38px;
      margin: 28px 0 15px;
    }

    .hero p {
      color: #6b7280;
      font-size: 18px;
      line-height: 1.7;
      margin: 0 auto;
      max-width: 700px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 24px;
      margin-top: 20px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 5px 20px rgba(0,0,0,.04);
    }

    .card h3 {
      margin-top: 0;
      font-size: 22px;
    }

    .info {
      color: #6b7280;
      line-height: 1.8;
    }

    .info li {
      margin-bottom: 5px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 17px 20px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .main-button {
      width: 100%;
      background: #111827;
      color: white;
      margin-top: 20px;
    }

    .main-button:disabled {
      opacity: .55;
    }

    .progress-box {
      display: none;
      margin-top: 20px;
    }

    .progress-text {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #111827;
      transition: width .2s;
    }

    .error {
      display: none;
      margin-top: 20px;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
      border-radius: 18px;
      padding: 18px;
      line-height: 1.7;
      word-break: break-word;
    }

    .chat {
      display: none;
    }

    .messages {
      min-height: 180px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 5px;
    }

    .message {
      margin: 12px 0;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #111827;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .message.assistant .bubble {
      background: #f3f4f6;
      color: #111827;
      border-bottom-left-radius: 5px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    textarea {
      flex: 1;
      resize: vertical;
      min-height: 52px;
      max-height: 150px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 13px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #111827;
    }

    .send {
      background: #111827;
      color: white;
      min-width: 85px;
    }

    .send:disabled {
      opacity: .5;
    }

    .small {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 22px;
      line-height: 1.6;
    }
