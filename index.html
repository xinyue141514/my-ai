<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的本地 AI</title>

<style>
body{
  margin:0;
  font-family:Arial,"Microsoft YaHei",sans-serif;
  background:#f4f6fa;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}
main{
  max-width:700px;
  margin:auto;
  padding:30px 18px;
  text-align:center;
}
.logo{
  width:120px;
  height:120px;
  margin:20px auto;
  border-radius:30px;
  background:#111827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  font-weight:bold;
}
p{
  color:#6b7280;
  line-height:1.7;
}
button{
  width:100%;
  padding:17px;
  margin-top:20px;
  border:0;
  border-radius:15px;
  background:#111827;
  color:white;
  font-size:18px;
  font-weight:bold;
}
#status{
  margin-top:20px;
  padding:18px;
  border-radius:15px;
  background:white;
  border:1px solid #ddd;
  text-align:left;
  white-space:pre-wrap;
  word-break:break-word;
}
#chat{
  display:none;
  margin-top:20px;
  background:white;
  padding:18px;
  border-radius:15px;
}
textarea{
  width:100%;
  min-height:80px;
  box-sizing:border-box;
  padding:12px;
  font-size:16px;
}
</style>
</head>

<body>

<header>🤖 我的本地 AI</header>

<main>

<div class="logo">AI</div>

<h1>我的本地 AI</h1>

<p>
AI 模型直接运行在浏览器中。<br>
第一次使用需要联网下载模型。
</p>

<button id="load">加载 AI</button>

<div id="status">
等待加载……
</div>

<div id="chat">

<textarea id="input"
placeholder="输入你想问的问题……"></textarea>

<button id="send">发送</button>

<div id="answer"></div>

</div>

</main>

<script type="module">

const MODEL =
"Llama-3.2-1B-Instruct-q4f16_1-MLC";

const status =
document.getElementById("status");

const load =
document.getElementById("load");

const chat =
document.getElementById("chat");

let engine = null;

function log(text){
  status.textContent += "\n" + text;
}

load.onclick = async function(){

  load.disabled = true;

  status.textContent =
  "正在检查 WebGPU……";

  try{

    if(!navigator.gpu){
      throw new Error(
        "这个浏览器没有 WebGPU。\n请使用最新版 Chrome 或 Edge。"
      );
    }

    const adapter =
      await navigator.gpu.requestAdapter();

    if(!adapter){
      throw new Error(
        "检测到了 WebGPU，但没有可用的 GPU。"
      );
    }

    log("✓ WebGPU 正常");

    log("正在加载 WebLLM……");

    const webllm =
      await import(
        "https://esm.run/@mlc-ai/web-llm"
      );

    log("✓ WebLLM 正常");

    log("正在下载/加载 AI 模型……");

    engine =
      await webllm.CreateMLCEngine(
        MODEL,
        {
          initProgressCallback:
          function(p){

            if(p && p.text){
              status.textContent =
              "正在加载 AI……\n" +
              p.text;
            }

          }
        }
      );

    status.textContent =
    "🎉 AI 加载成功！\n\n" +
    "现在可以开始聊天了。";

    chat.style.display =
    "block";

    load.textContent =
    "AI 已加载";

  }catch(error){

    console.error(error);

    status.textContent =
    "❌ 加载失败\n\n" +
    error.message;

    load.disabled = false;
    load.textContent =
    "重新加载 AI";

  }

};


document.getElementById("send").onclick =
async function(){

  if(!engine){
    alert("请先加载 AI");
    return;
  }

  const input =
  document.getElementById("input");

  const answer =
  document.getElementById("answer");

  const text =
  input.value.trim();

  if(!text)return;

  answer.textContent =
  "AI 正在思考……";

  try{

    const result =
    await engine.chat.completions.create({

      messages:[
        {
          role:"system",
          content:
          "你是一个友好的中文 AI 助手，请用中文回答。"
        },
        {
          role:"user",
          content:text
        }
      ],

      temperature:0.7,
      max_tokens:300

    });

    answer.textContent =
    result.choices[0].message.content;

  }catch(error){

    answer.textContent =
    "回答失败：\n" +
    error.message;

  }

};

</script>

</body>
</html>
