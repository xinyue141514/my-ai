<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#f5f7fb"
>

<title>我的本地 AI</title>

<style>

/* =========================
   基础
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;
  background:#f5f7fb;
  color:#111827;
}

body{
  overflow:hidden;
}

button,
textarea{
  font-family:inherit;
}


/* =========================
   整体布局
========================= */

.app{
  width:100%;
  height:100vh;
  position:relative;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:260px;
  background:#ffffff;
  border-right:1px solid #e5e7eb;
  z-index:30;
  display:flex;
  flex-direction:column;
  transition:left .25s ease;
}

.main{
  position:absolute;
  left:260px;
  top:0;
  right:0;
  bottom:0;
  display:flex;
  flex-direction:column;
  min-width:0;
}


/* =========================
   侧边栏
========================= */

.sidebar-top{
  padding:15px;
}

.newchat{
  width:100%;
  height:46px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#ffffff;
  color:#111827;
  font-size:15px;
  cursor:pointer;
}

.newchat:hover{
  background:#f3f4f6;
}

.history-title{
  padding:8px 15px;
  color:#6b7280;
  font-size:13px;
}

.history{
  flex:1;
  overflow-y:auto;
  padding:5px 10px 20px;
}

.chat-item{
  width:100%;
  min-height:44px;
  margin-bottom:5px;
  padding:0 8px 0 12px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  color:#374151;
}

.chat-item:hover{
  background:#f3f4f6;
}

.chat-item.active{
  background:#e5e7eb;
  color:#111827;
}

.chat-title{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:14px;
}

.delete-chat{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#9ca3af;
  cursor:pointer;
  font-size:16px;
}

.delete-chat:hover{
  background:#fee2e2;
  color:#dc2626;
}


/* =========================
   顶部
========================= */

.header{
  height:62px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 20px;
  background:rgba(255,255,255,.92);
  border-bottom:1px solid #e5e7eb;
  backdrop-filter:blur(10px);
}

.menu{
  display:none;
  width:40px;
  height:40px;
  border:0;
  border-radius:10px;
  background:transparent;
  font-size:22px;
  cursor:pointer;
}

.header-title{
  font-size:17px;
  font-weight:600;
}

.status{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  color:#6b7280;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#f59e0b;
}

.status.ok .status-dot{
  background:#10b981;
}

.status.error .status-dot{
  background:#ef4444;
}


/* =========================
   消息区域
========================= */

.messages{
  flex:1;
  overflow-y:auto;
  padding:25px 20px 150px;
  scroll-behavior:smooth;
}

.message{
  width:100%;
  max-width:900px;
  margin:0 auto 20px;
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.message.user{
  flex-direction:row-reverse;
}

.avatar{
  width:38px;
  height:38px;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e5e7eb;
  font-size:18px;
}

.message.user .avatar{
  background:#111827;
  color:#ffffff;
}

.content{
  max-width:78%;
  padding:12px 15px;
  border-radius:16px;
  background:#ffffff;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  color:#1f2937;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.user .content{
  background:#111827;
  color:#ffffff;
}


/* =========================
   欢迎页
========================= */

.welcome{
  max-width:700px;
  margin:70px auto;
  text-align:center;
  padding:20px;
}

.welcome-icon{
  width:76px;
  height:76px;
  margin:0 auto 20px;
  border-radius:24px;
  background:#111827;
  color:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
}

.welcome h1{
  margin:0 0 12px;
  font-size:30px;
}

.welcome p{
  margin:0;
  color:#6b7280;
  line-height:1.8;
}


/* =========================
   输入区域
========================= */

.input-area{
  position:fixed;
  left:260px;
  right:0;
  bottom:0;
  padding:12px 20px 20px;
  background:
    linear-gradient(
      to top,
      #f5f7fb 75%,
      rgba(245,247,251,0)
    );
}

.input-box{
  width:100%;
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:10px;
  background:#ffffff;
  border:1px solid #d1d5db;
  border-radius:18px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

textarea{
  flex:1;
  min-width:0;
  min-height:26px;
  max-height:150px;
  padding:8px 4px;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  font-size:16px;
  line-height:1.5;
  color:#111827;
}

.send{
  width:44px;
  height:44px;
  flex-shrink:0;
  border:0;
  border-radius:12px;
  background:#111827;
  color:#ffffff;
  font-size:18px;
  cursor:pointer;
}

.send:disabled{
  opacity:.45;
  cursor:not-allowed;
}


/* =========================
   AI 加载界面
========================= */

.loading{
  position:fixed;
  inset:0;
  z-index:100;
  background:#f5f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.loading-box{
  width:min(420px,90vw);
}

.loading-icon{
  width:90px;
  height:90px;
  margin:0 auto 20px;
  border-radius:28px;
  background:#111827;
  color:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.loading h2{
  margin:0 0 10px;
  font-size:30px;
}

.loading-text{
  min-height:50px;
  color:#6b7280;
  line-height:1.7;
  white-space:pre-line;
}

.progress{
  width:100%;
  height:9px;
  margin-top:20px;
  overflow:hidden;
  border-radius:10px;
  background:#e5e7eb;
}

.progress-bar{
  width:0%;
  height:100%;
  border-radius:10px;
  background:#111827;
  transition:width .2s ease;
}

.retry{
  margin-top:20px;
  padding:11px 22px;
  border:0;
  border-radius:12px;
  background:#111827;
  color:#ffffff;
  font-size:15px;
  cursor:pointer;
}

.retry:hover{
  opacity:.9;
}

</style>

</head>
<body>

<!-- =========================
     AI 加载界面
========================= -->

<div
  class="loading"
  id="loading"
>

  <div class="loading-box">

    <div class="loading-icon">
      AI
    </div>

    <h2>
      我的本地 AI
    </h2>

    <div
      class="loading-text"
      id="loadingText"
    >
      AI 尚未启动
    </div>

    <div class="progress">

      <div
        class="progress-bar"
        id="progressBar"
      ></div>

    </div>

    <button
      class="retry"
      id="retry"
      style="display:block;"
    >
      开始加载 AI
    </button>

  </div>

</div>


<!-- =========================
     主应用
========================= -->

<div class="app">

  <!-- 左侧历史记录 -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-top">

      <button
        class="newchat"
        id="newChat"
      >
        ＋ 新建聊天
      </button>

    </div>

    <div class="history-title">
      聊天记录
    </div>

    <div
      class="history"
      id="history"
    ></div>

  </aside>


  <!-- 主区域 -->

  <main class="main">

    <header class="header">

      <button
        class="menu"
        id="menu"
        aria-label="菜单"
      >
        ☰
      </button>

      <div class="header-title">
        我的本地 AI
      </div>

      <div
        class="status"
        id="status"
      >

        <span class="status-dot"></span>

        <span id="statusText">
          AI 未加载
        </span>

      </div>

    </header>


    <!-- 消息 -->

    <section
      class="messages"
      id="messages"
    >

      <div class="welcome">

        <div class="welcome-icon">
          AI
        </div>

        <h1>
          你好 👋
        </h1>

        <p>
          我是你的本地 AI 助手。<br>
          点击上面的「开始加载 AI」后，就可以开始聊天。
        </p>

      </div>

    </section>


    <!-- 输入区域 -->

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="input"
          rows="1"
          placeholder="输入消息……"
          disabled
        ></textarea>

        <button
          class="send"
          id="send"
          disabled
        >
          ➤
        </button>

      </div>

    </div>

  </main>

</div>


<!-- =========================
     JavaScript
========================= -->

<script type="module">

/* =========================
   模型
========================= */

const MODEL =
  "Llama3.2-1B-Instruct-q4f16_1-MLC";


/* =========================
   全局变量
========================= */

let engine = null;

let currentChat = null;

let isGenerating = false;


/* =========================
   页面元素
========================= */

const loading =
  document.getElementById("loading");

const loadingText =
  document.getElementById("loadingText");

const progressBar =
  document.getElementById("progressBar");

const retry =
  document.getElementById("retry");

const sidebar =
  document.getElementById("sidebar");

const history =
  document.getElementById("history");

const messages =
  document.getElementById("messages");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const newChatBtn =
  document.getElementById("newChat");

const menuBtn =
  document.getElementById("menu");

const status =
  document.getElementById("status");

const statusText =
  document.getElementById("statusText");


/* =========================
   聊天记录
========================= */

let chats = {};

try{

  chats =
    JSON.parse(
      localStorage.getItem(
        "myAI_chats"
      ) || "{}"
    );

}catch(error){

  chats = {};

}


/* =========================
   保存
========================= */

function saveChats(){

  try{

    localStorage.setItem(
      "myAI_chats",
      JSON.stringify(chats)
    );

  }catch(error){

    console.error(
      "保存聊天记录失败",
      error
    );

  }

}


/* =========================
   状态
========================= */

function setStatus(
  text,
  type = ""
){

  statusText.textContent = text;

  status.className =
    "status " + type;

}


/* =========================
   新建聊天
========================= */

function newChat(){

  const id =
    Date.now().toString();

  chats[id] = {

    title:"新聊天",

    messages:[],

    createdAt:
      Date.now()

  };

  currentChat = id;

  saveChats();

  renderHistory();

  renderMessages();

  input.focus();

}


/* =========================
   删除聊天
========================= */

function deleteChat(id){

  const ok =
    confirm(
      "确定要删除这个聊天吗？"
    );

  if(!ok){
    return;
  }

  delete chats[id];

  const ids =
    Object.keys(chats);

  if(currentChat === id){

    if(ids.length > 0){

      currentChat =
        ids[ids.length - 1];

    }else{

      currentChat = null;

    }

  }

  saveChats();

  renderHistory();

  renderMessages();

}


/* =========================
   打开聊天
========================= */

function openChat(id){

  if(!chats[id]){
    return;
  }

  currentChat = id;

  renderHistory();

  renderMessages();

  if(
    window.innerWidth <= 700
  ){

    sidebar.classList.remove(
      "open"
    );

  }

}


/* =========================
   历史记录
========================= */

function renderHistory(){

  history.innerHTML = "";

  const ids =
    Object.keys(chats)
      .sort(
        (a,b) =>
          (chats[b].createdAt || 0) -
          (chats[a].createdAt || 0)
      );

  ids.forEach(id => {

    const chat =
      chats[id];

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "chat-item" +
      (
        id === currentChat
          ? " active"
          : ""
      );

    item.addEventListener(
      "click",
      () => openChat(id)
    );

    const title =
      document.createElement(
        "div"
      );

    title.className =
      "chat-title";

    title.textContent =
      chat.title ||
      "新聊天";

    const del =
      document.createElement(
        "button"
      );

    del.className =
      "delete-chat";

    del.textContent =
      "×";

    del.title =
      "删除聊天";

    del.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        deleteChat(id);

      }
    );

    item.appendChild(title);

    item.appendChild(del);

    history.appendChild(item);

  });

}


/* =========================
   渲染消息
========================= */

function renderMessages(){

  messages.innerHTML = "";

  if(!currentChat){

    showWelcome();

    return;

  }

  const chat =
    chats[currentChat];

  if(
    !chat ||
    !chat.messages ||
    chat.messages.length === 0
  ){

    showWelcome();

    return;

  }

  chat.messages.forEach(
    message => {

      addMessageElement(
        message.role,
        message.content
      );

    }
  );

  scrollToBottom();

}


/* =========================
   欢迎页面
========================= */

function showWelcome(){

  messages.innerHTML = `

    <div class="welcome">

      <div class="welcome-icon">
        AI
      </div>

      <h1>
        你好 👋
      </h1>

      <p>
        我是你的本地 AI 助手。<br>
        可以连续聊天，聊天记录会保存在本机。
      </p>

    </div>

  `;

}


/* =========================
   添加消息
========================= */

function addMessageElement(
  role,
  text
){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message " + role;

  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "user"
      ? "你"
      : "AI";

  const content =
    document.createElement(
      "div"
    );

  content.className =
    "content";

  content.textContent =
    text || "";

  row.appendChild(avatar);

  row.appendChild(content);

  messages.appendChild(row);

  return content;

}


/* =========================
   滚动到底部
========================= */

function scrollToBottom(){

  messages.scrollTop =
    messages.scrollHeight;

}
    /* =========================
   加载 AI
========================= */

async function loadAI(){

  retry.disabled = true;

  retry.textContent =
    "正在加载……";

  progressBar.style.width =
    "0%";

  loadingText.textContent =
    "正在检查 WebGPU……";

  setStatus(
    "正在加载 AI……"
  );

  try{

    /* -------------------------
       检查 WebGPU
    ------------------------- */

    if(
      !navigator.gpu
    ){

      throw new Error(
        "当前浏览器不支持 WebGPU，请使用新版 Chrome。"
      );

    }

    const adapter =
      await navigator.gpu.requestAdapter();

    if(!adapter){

      throw new Error(
        "没有找到可用的 GPU。"
      );

    }

    progressBar.style.width =
      "5%";

    loadingText.textContent =
      "✓ WebGPU 正常\n正在加载 WebLLM……";


    /* -------------------------
       加载 WebLLM
    ------------------------- */

    const webllm =
      await import(
        "https://esm.run/@mlc-ai/web-llm"
      );

    progressBar.style.width =
      "10%";

    loadingText.textContent =
      "✓ WebLLM 正常\n正在准备 AI 模型……";


    /* -------------------------
       创建 AI 引擎
    ------------------------- */

    engine =
      await webllm.CreateMLCEngine(
        MODEL,
        {

          initProgressCallback:
            progress => {

              let value =
                Number(
                  progress?.progress
                );

              if(
                !Number.isFinite(value)
              ){

                value = 0;

              }

              value =
                Math.max(
                  0,
                  Math.min(
                    1,
                    value
                  )
                );

              const percent =
                Math.round(
                  value * 100
                );

              progressBar.style.width =
                percent + "%";

              loadingText.textContent =
                "正在加载 AI 模型……\n" +
                (
                  progress?.text ||
                  "正在准备模型"
                ) +
                "\n" +
                percent +
                "%";

            }

        }
      );


    /* -------------------------
       加载完成
    ------------------------- */

    progressBar.style.width =
      "100%";

    loadingText.textContent =
      "✓ AI 加载成功！";

    setStatus(
      "AI 已加载",
      "ok"
    );

    input.disabled =
      false;

    send.disabled =
      false;

    retry.style.display =
      "none";

    setTimeout(
      () => {

        loading.style.display =
          "none";

        input.focus();

      },
      500
    );


    /* -------------------------
       如果没有聊天
    ------------------------- */

    if(!currentChat){

      const ids =
        Object.keys(chats);

      if(ids.length > 0){

        currentChat =
          ids.sort(
            (a,b) =>
              (
                chats[b].createdAt || 0
              ) -
              (
                chats[a].createdAt || 0
              )
          )[0];

      }else{

        newChat();

      }

    }

    renderHistory();

    renderMessages();


  }catch(error){

    console.error(
      "AI 加载失败:",
      error
    );

    engine = null;

    input.disabled =
      true;

    send.disabled =
      true;

    setStatus(
      "加载失败",
      "error"
    );

    loadingText.textContent =
      "AI 加载失败\n\n" +
      (
        error?.message ||
        String(error)
      );

    progressBar.style.width =
      "0%";

    retry.disabled =
      false;

    retry.textContent =
      "重新加载 AI";

    retry.style.display =
      "inline-block";

  }

}


/* =========================
   发送消息
========================= */

async function sendMessage(){

  if(isGenerating){
    return;
  }

  const text =
    input.value.trim();

  if(
    !text ||
    !engine
  ){

    return;

  }


  /* -------------------------
     创建聊天
  ------------------------- */

  if(!currentChat){

    newChat();

  }

  const chat =
    chats[currentChat];

  if(!chat){
    return;
  }


  /* -------------------------
     设置标题
  ------------------------- */

  if(
    !chat.messages ||
    chat.messages.length === 0
  ){

    chat.title =
      text.length > 18
        ? text.slice(0,18) + "…"
        : text;

  }


  /* -------------------------
     保存用户消息
  ------------------------- */

  chat.messages.push({

    role:"user",

    content:text

  });

  saveChats();

  renderHistory();


  /* -------------------------
     删除欢迎页
  ------------------------- */

  const welcome =
    messages.querySelector(
      ".welcome"
    );

  if(welcome){

    welcome.remove();

  }


  /* -------------------------
     显示用户消息
  ------------------------- */

  addMessageElement(
    "user",
    text
  );

  scrollToBottom();


  /* -------------------------
     清空输入
  ------------------------- */

  input.value = "";

  input.style.height =
    "auto";


  /* -------------------------
     锁定按钮
  ------------------------- */

  isGenerating =
    true;

  send.disabled =
    true;

  input.disabled =
    true;

  setStatus(
    "正在思考……"
  );


  /* -------------------------
     AI 消息气泡
  ------------------------- */

  const assistantContent =
    addMessageElement(
      "assistant",
      "正在思考……"
    );

  scrollToBottom();


  let answer = "";


  try{

    /* -------------------------
       构造上下文
    ------------------------- */

    const conversation = [

      {
        role:"system",

        content:
          "你是一个友好、聪明、简洁的中文 AI 助手。" +
          "请直接回答用户的问题。" +
          "如果不知道答案，请诚实说明。" +
          "回答尽量清晰，不要重复用户的问题。"
      },

      ...chat.messages

    ];


    /* -------------------------
       请求 AI
    ------------------------- */

    const response =
      await engine.chat.completions.create({

        messages:
          conversation,

        temperature:
          0.7,

        max_tokens:
          300,

        stream:
          true

      });


    /* -------------------------
       流式输出
    ------------------------- */

    assistantContent.textContent =
      "";

    for await(
      const chunk of response
    ){

      const piece =
        chunk
          ?.choices?.[0]
          ?.delta
          ?.content;

      if(piece){

        answer += piece;

        assistantContent.textContent =
          answer;

        scrollToBottom();

      }

    }


    /* -------------------------
       保存 AI 回答
    ------------------------- */

    if(!answer){

      answer =
        "我这次没有生成出有效回答，请再试一次。";

      assistantContent.textContent =
        answer;

    }

    chat.messages.push({

      role:"assistant",

      content:answer

    });

    saveChats();

    setStatus(
      "AI 已加载",
      "ok"
    );


  }catch(error){

    console.error(
      "回答错误:",
      error
    );

    assistantContent.textContent =
      "抱歉，回答时出现错误：\n" +
      (
        error?.message ||
        String(error)
      );

    setStatus(
      "回答出错",
      "error"
    );

  }


  /* -------------------------
     恢复输入
  ------------------------- */

  isGenerating =
    false;

  send.disabled =
    false;

  input.disabled =
    false;

  input.focus();

  scrollToBottom();

}


/* =========================
   初始化聊天
========================= */

function initChats(){

  const ids =
    Object.keys(chats);

  if(ids.length === 0){

    currentChat = null;

    renderHistory();

    renderMessages();

    return;

  }

  ids.sort(
    (a,b) =>
      (
        chats[b].createdAt || 0
      ) -
      (
        chats[a].createdAt || 0
      )
  );

  currentChat =
    ids[0];

  renderHistory();

  renderMessages();

}
    /* =========================
   新建聊天按钮
========================= */

newChatBtn.addEventListener(
  "click",
  () => {

    if(isGenerating){
      return;
    }

    newChat();

    if(
      window.innerWidth <= 700
    ){

      sidebar.classList.remove(
        "open"
      );

    }

  }
);


/* =========================
   手机菜单
========================= */

menuBtn.addEventListener(
  "click",
  () => {

    sidebar.classList.toggle(
      "open"
    );

  }
);


/* =========================
   点击消息区域
========================= */

messages.addEventListener(
  "click",
  () => {

    if(
      window.innerWidth <= 700
    ){

      sidebar.classList.remove(
        "open"
      );

    }

  }
);


/* =========================
   发送按钮
========================= */

send.addEventListener(
  "click",
  () => {

    sendMessage();

  }
);


/* =========================
   输入框回车
========================= */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   输入框自动高度
========================= */

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        150
      ) + "px";

  }
);


/* =========================
   开始加载按钮
========================= */

retry.addEventListener(
  "click",
  () => {

    if(
      retry.disabled
    ){

      return;

    }

    loadAI();

  }
);


/* =========================
   页面点击
========================= */

document.addEventListener(
  "click",
  event => {

    if(
      window.innerWidth > 700
    ){

      return;

    }

    if(
      !sidebar.classList.contains(
        "open"
      )
    ){

      return;

    }

    const insideSidebar =
      sidebar.contains(
        event.target
      );

    const insideMenu =
      menuBtn.contains(
        event.target
      );

    if(
      !insideSidebar &&
      !insideMenu
    ){

      sidebar.classList.remove(
        "open"
      );

    }

  }
);


/* =========================
   窗口尺寸变化
========================= */

window.addEventListener(
  "resize",
  () => {

    if(
      window.innerWidth > 700
    ){

      sidebar.classList.remove(
        "open"
      );

    }

  }
);


/* =========================
   初始化
========================= */

initChats();


/*
   注意：

   这里故意不自动执行 loadAI()。

   用户打开网页以后，
   必须点击：

   「开始加载 AI」

   才开始下载和加载模型。
*/
